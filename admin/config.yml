              - { label: "Nome exibido", name: "nome", widget: "string" }
              - { label: "Endereço (link)", name: "url", widget: "string", required: false }

          - label: "AdonaiTune Kids — Bloco 1 (título, áudio e carrossel)"
            name: "bloco_kids_1"
            widget: "object"
            fields:
