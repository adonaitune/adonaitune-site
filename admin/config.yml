              - { label: "Áudio (enviar arquivo mp3)", name: "audio", widget: "file", required: false }
              - label: "Carrossel de imagens (até 5 imagens)"
                name: "images"
                widget: "list"
                required: false
                max: 5
                summary: "{{fields.img}}"
                field: { label: "Imagem", name: "img", widget: "image" }

          - label: "AdonaiTune Kids — Bloco 2 (título, áudio e carrossel)"
            name: "bloco_kids_2"
