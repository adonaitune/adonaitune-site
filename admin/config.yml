              - label: "Carrossel de imagens (até 5 imagens)"
                name: "images"
                widget: "list"
                required: false
                max: 5
                summary: "{{fields.img}}"
                field: { label: "Imagem", name: "img", widget: "image" }

          - label: "Vídeos do YouTube — Café com Elas (carrossel)"
            name: "podcast"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título do episódio", name: "title", widget: "string" }
              - { label: "Data (texto livre)", name: "date", widget: "string", required: false }
              - { label: "Resumo", name: "text", widget: "text", required: false }
              - { label: "Link do vídeo no YouTube (se tiver)", name: "url", widget: "string", required: false }
              - { label: "Arquivo de áudio mp3 (se não for YouTube)", name: "src", widget: "file", required: false }
              - { label: "Marcar como exemplo", name: "exemplo", widget: "boolean", default: false }

          - label: "Onde ouvir — Podcast"
            name: "social_podcast"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Plataforma", name: "rede", widget: "select", options: ["spotify","podcast","youtube","instagram","whatsapp"] }
              - { label: "Nome exibido", name: "nome", widget: "string" }
              - { label: "Endereço (link)", name: "url", widget: "string", required: false }

          - label: "YouTube (vídeos automáticos)"
            name: "youtube"
            widget: "object"
            fields:
              - { label: "Chave da API do YouTube (Google)", name: "apiKey", widget: "string", required: false }
              - { label: "Canal (o @ sem o arroba, ex.: adonaitune)", name: "channelHandle", widget: "string", required: false }
              - { label: "Canal do Adonai Shalom (opcional, se for outro canal)", name: "channelHandleShalom", widget: "string", required: false }
              - { label: "Canal Kids (opcional, se for outro canal)", name: "channelHandleKids", widget: "string", required: false }

          - label: "Vídeos escolhidos — Adonai Shalom (opcional)"
            name: "videos_shalom"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Link do vídeo no YouTube", name: "url", widget: "string" }
              - { label: "Título", name: "title", widget: "string", required: false }

          - label: "Vídeos escolhidos — AdonaiTune (opcional)"
            name: "videos_tune"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
