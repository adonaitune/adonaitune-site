          - label: "Redes sociais — AdonaiTune Kids"
            name: "social_kids"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Rede", name: "rede", widget: "select", options: ["instagram","facebook","youtube","whatsapp","tiktok"] }
              - { label: "Nome exibido", name: "nome", widget: "string" }
              - { label: "Endereço (link)", name: "url", widget: "string", required: false }

          - label: "Café com Elas — quadro em destaque (ao vivo)"
            name: "podcast_live"
            widget: "object"
            fields:
              - { label: "Link do vídeo ou da transmissão ao vivo no YouTube", name: "url", widget: "string", required: false }
              - { label: "Está ao vivo agora? (mostra a etiqueta AO VIVO)", name: "aovivo", widget: "boolean", default: false }
              - { label: "Título do quadro", name: "title", widget: "string", required: false }
              - { label: "Texto curto (ex.: toda quinta às 19h)", name: "text", widget: "string", required: false }
              - { label: "Código do canal (opcional, começa com UC)", name: "channelId", widget: "string", required: false }

          - label: "Café com Elas — Bloco 1 (título, áudio e carrossel)"
            name: "bloco_podcast_1"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string", required: false }
              - { label: "Áudio (enviar arquivo mp3)", name: "audio", widget: "file", required: false }
              - label: "Carrossel de imagens (até 5 imagens)"
